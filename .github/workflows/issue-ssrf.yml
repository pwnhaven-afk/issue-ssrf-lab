name: issue-ssrf-lab
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
  issues: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local canary HTTP service
        run: |
          mkdir -p /tmp/canary
          echo "CANARY-OK" > /tmp/canary/index.html
          nohup python3 -m http.server 8123 --directory /tmp/canary > /tmp/canary_access.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "selfcheck=%{http_code}\n" http://127.0.0.1:8123/
      - name: Replica fetch (close-invalid-link.cjs sink)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/close-invalid-link-replica.mjs
      - name: Show canary access log
        run: cat /tmp/canary_access.log
